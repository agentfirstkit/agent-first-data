[package]
name = "agent-first-data"
version = "0.29.2"
edition = "2024"
description = "A naming convention that lets AI agents understand your data without being told what it means, plus a CLI and library for reading Markdown structure and safely editing structured JSON, TOML, YAML, dotenv, and INI documents."
license = "MIT"
repository = "https://github.com/agentfirstkit/agent-first-data"
readme = "README.md"

[lib]
path = "rust/src/lib.rs"

[[bin]]
name = "afdata"
path = "cli/src/main.rs"
required-features = ["cli"]

[[example]]
name = "agent_cli"
path = "rust/examples/agent_cli.rs"
required-features = ["cli"]

[[example]]
name = "afdata_bench"
path = "rust/examples/afdata_bench.rs"

[features]
# Batteries included by default, for both the binary and the library:
# `cargo install agent-first-data` gets the full CLI (closed-world help-v2,
# skill management, stream redirection) and `cargo add agent-first-data` gets every helper
# including tracing. Consumers that want only the core formatting/redaction/
# protocol/document surface opt out with `default-features = false`.
default = [
    "cli",
    "tracing",
    "skill-admin",
    "stream-redirect",
    "yaml",
    "toml",
    "dotenv",
    "ini",
    "markdown",
]
# The whole CLI surface: the closed-world compiler (`cli_spec`), the AFDATA
# adapter that turns a resolved outcome into a protocol event (`cli_afdata`),
# the emitter and version payloads (`cli`), and the `afdata` binary. With it
# off nothing CLI-shaped is linked, which is exactly what `scripts/test.sh
# static` builds to prove the data surface stands alone. `OutputFormat` is the
# deliberate exception: `render` takes it, so it lives in `formatting`.
cli = []
tracing = ["dep:tracing", "dep:tracing-subscriber"]
skill = ["dep:noyalib"]
skill-admin = ["skill"]
stream-redirect = ["dep:libc"]
yaml = ["dep:noyalib"]
toml = ["dep:toml", "dep:toml_edit"]
dotenv = []
ini = []
# Read-only CommonMark block structure. In `default` alongside the other format
# backends so an installed CLI reads a README out of the box; `default-features
# = false` drops it and `pulldown-cmark` with it.
markdown = ["dep:pulldown-cmark"]
schema = []

[dependencies]
# `arbitrary_precision` is load-bearing for the document layer's number
# literal fidelity (§4): it makes `serde_json::Number` retain the exact
# source text of a parsed number instead of collapsing it through f64,
# which is what `document::Value::Number` relies on to avoid corrupting
# integers beyond u64 range or high-precision float literals. See
# `rust/src/document/value.rs`.
serde_json = { version = "1", features = ["arbitrary_precision"] }
serde = { version = "1", features = ["derive"] }
chrono = "0.4"
url = "2"
tracing = { version = "0.1", optional = true }
tracing-subscriber = { version = "0.3", features = ["env-filter", "registry"], optional = true }
libc = { version = "0.2", optional = true }
noyalib = { version = "0.0.18", features = ["lossless-u64"], optional = true }
toml = { version = "1", optional = true }
toml_edit = { version = "0.25", optional = true }
# `default-features = false` drops the HTML renderer and the getopts-driven
# binary, neither of which a block reader uses; what is left is the pull parser
# over three small pure-Rust crates (bitflags, memchr, unicase).
pulldown-cmark = { version = "0.13", default-features = false, optional = true }

[dev-dependencies]
tempfile = "3"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
print_stdout = "deny"
print_stderr = "deny"
